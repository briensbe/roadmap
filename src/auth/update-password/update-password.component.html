<div class="update-password-container">
  <div class="update-password-card">
    <h2>Modifier votre mot de passe</h2>
    <p class="subtitle">Mettez à jour vos identifiants de sécurité</p>

    @if (error()) {
      <div class="message error">
        {{ error() }}
      </div>
    }

    @if (success()) {
      <div class="message success">
        Mot de passe mis à jour avec succès !
      </div>

      <button class="profile-button" (click)="goToProfile()">
        <lucide-icon [img]="ArrowLeft" size="18"></lucide-icon>
        Retour au profil
      </button>
    } @else {
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="currentPassword">Mot de passe actuel</label>
          <div class="password-container">
            <input
              [type]="showCurrentPassword() ? 'text' : 'password'"
              id="currentPassword"
              [ngModel]="currentPassword()"
              (ngModelChange)="onCurrentPasswordChange($event)"
              name="currentPassword"
              placeholder="Votre mot de passe actuel"
              required
              [disabled]="loading()"
              autocomplete="current-password" />
            <button type="button" class="toggle-password" tabindex="-1" (click)="toggleCurrentPasswordVisibility()">
              <lucide-icon [img]="showCurrentPassword() ? EyeOff : Eye" size="20"></lucide-icon>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="newPassword">Nouveau mot de passe</label>
          <div class="password-container">
            <input
              [type]="showNewPassword() ? 'text' : 'password'"
              id="newPassword"
              [ngModel]="newPassword()"
              (ngModelChange)="onNewPasswordChange($event)"
              name="newPassword"
              required
              minlength="6"
              placeholder="Minimum 6 caractères"
              [disabled]="loading()"
              autocomplete="new-password" />
            <button type="button" class="toggle-password" tabindex="-1" (click)="toggleNewPasswordVisibility()">
              <lucide-icon [img]="showNewPassword() ? EyeOff : Eye" size="20"></lucide-icon>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmer le nouveau mot de passe</label>
          <div class="password-container">
            <input
              [type]="showConfirmPassword() ? 'text' : 'password'"
              id="confirmPassword"
              [ngModel]="confirmPassword()"
              (ngModelChange)="onConfirmPasswordChange($event)"
              name="confirmPassword"
              required
              minlength="6"
              placeholder="Confirmez votre mot de passe"
              [disabled]="loading()"
              autocomplete="new-password" />
            <button type="button" class="toggle-password" tabindex="-1" (click)="toggleConfirmPasswordVisibility()">
              <lucide-icon [img]="showConfirmPassword() ? EyeOff : Eye" size="20"></lucide-icon>
            </button>
          </div>
        </div>

        <button type="submit" [disabled]="loading()">
          {{ loading() ? 'Mise à jour...' : 'Mettre à jour le mot de passe' }}
        </button>

        <button type="button" class="profile-button" (click)="goToProfile()">
          <lucide-icon [img]="ArrowLeft" size="18"></lucide-icon>
          Annuler et retourner au profil
        </button>
      </form>
    }
  </div>
</div>
