<div class="container">
  <h2>Profil Utilisateur</h2>
  <p>Session authentifiée avec succès 🎉</p>
  <button class="btn btn-primary" (click)="toggleUserInfo()" [disabled]="loading">
    {{ loading ? 'Chargement...' : showInfo ? 'Masquer les informations' : 'Afficher les informations personnelles' }}
  </button>

  @if (showInfo && user()) {
    <div class="user-info">
      <p>ID Utilisateur : {{ user()?.id }}</p>
      <p>Email : {{ user()?.email }}</p>
      <p>Nom d'affichage : {{ user()?.user_metadata?.['displayName'] }}</p>
    </div>
  }

  <div class="theme-selector">
    <label>Préférence de Thème :</label>
    <div class="theme-buttons">
      @for (theme of themeOptions; track theme.value) {
        <button
          type="button"
          class="theme-btn"
          [class.active]="themeService.preference() === theme.value"
          (click)="setTheme(theme.value)"
          [title]="theme.label"
        >
          <lucide-icon [img]="theme.icon" [size]="20"></lucide-icon>
          <span>{{ theme.label }}</span>
        </button>
      }
    </div>
  </div>

  <button class="btn btn-secondary" (click)="updatePassword()">Modifier le mot de passe</button>

  <button class="btn btn-danger" (click)="signOut()">Se déconnecter</button>
</div>
