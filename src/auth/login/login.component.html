<div class="container">
  <h2>Login</h2>

  @if (sessionExpired()) {
    <div class="session-expired-alert">
      <lucide-icon [img]="Info" size="18"></lucide-icon>
      <span>Votre session a expiré car vous vous êtes déconnecté sur un autre onglet.</span>
    </div>
  }
  <form (ngSubmit)="signInWithEmail()">
    <input type="email" [(ngModel)]="email" name="email" placeholder="Email" required autocomplete="email" />
    <div class="password-container">
      <input
        [type]="showPassword() ? 'text' : 'password'"
        [(ngModel)]="password"
        name="password"
        placeholder="Password"
        required
        autocomplete="current-password" />
      <button type="button" class="toggle-password" tabindex="-1" (click)="togglePasswordVisibility()">
        <lucide-icon [img]="showPassword() ? EyeOff : Eye" size="20"></lucide-icon>
      </button>
    </div>
    <button type="submit" [disabled]="loading">
      {{ loading ? 'Loading...' : 'Sign In' }}
    </button>
  </form>

  <div class="divider">
    <span>or</span>
  </div>

  <button type="button" class="google-btn" (click)="signInWithGoogle()" [disabled]="loading">
    <img src="assets/google-logo.svg" alt="Google logo" />
    Sign in with Google
  </button>
  <p>Don't have an account? <a (click)="navigateToSignup()">Sign Up</a></p>
  <p>Forgot your password ? <a (click)="navigateToForgot()">Send me a link</a></p>
</div>
