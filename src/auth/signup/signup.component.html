<div class="container">
  <h2>Inscription</h2>
  <form (ngSubmit)="signUp()">
    <input
      type="text"
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
      name="name"
      placeholder="Nom complet"
      required
      autocomplete="name" />
    <input
      type="email"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      name="email"
      [placeholder]="emailPlaceholder()"
      required
      autocomplete="email" />
    <div class="password-container">
      <input
        [type]="showPassword() ? 'text' : 'password'"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        name="password"
        minlength="6"
        placeholder="Mot de passe (Minimum 6 caractères)"
        required
        autocomplete="new-password" />
      <button type="button" class="toggle-password" tabindex="-1" (click)="togglePasswordVisibility()">
        <lucide-icon [img]="showPassword() ? EyeOff : Eye" size="20"></lucide-icon>
      </button>
    </div>
    <div class="password-container">
      <input
        [type]="showConfirmPassword() ? 'text' : 'password'"
        id="confirmPassword"
        [ngModel]="confirmPassword()"
        (ngModelChange)="confirmPassword.set($event)"
        name="confirmPassword"
        placeholder="Confirmez votre mot de passe"
        minlength="6"
        required
        autocomplete="new-password" />
      <button type="button" class="toggle-password" tabindex="-1" (click)="toggleConfirmPasswordVisibility()">
        <lucide-icon [img]="showConfirmPassword() ? EyeOff : Eye" size="20"></lucide-icon>
      </button>
    </div>

    <button type="submit" [disabled]="loading()">
      @if (loading()) {
        <span>Inscription en cours...</span>
      } @else {
        <span>S'inscrire</span>
      }
    </button>
  </form>

  @if (errorMessage()) {
    <div class="message error">
      {{ errorMessage() }}
    </div>
  }

  @if (successMessage()) {
    <div class="message success">
      {{ successMessage() }}
    </div>
  }

  <p>Vous avez déjà un compte ? <a (click)="navigateToLogin()">Se connecter</a></p>
</div>
