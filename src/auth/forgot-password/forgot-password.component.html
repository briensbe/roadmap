<div class="forgot-password-container">
  <h2>Mot de passe oublié</h2>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Adresse Email</label>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.5rem; line-height: 1.4;">
        Saisissez l'adresse email associée à votre compte. Nous vous enverrons un code de confirmation à 6 chiffres
        pour réinitialiser votre mot de passe.
      </p>
      <input
        type="email"
        id="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        name="email"
        required
        [placeholder]="emailPlaceholder()" />
    </div>

    <button type="submit" [disabled]="loading()">
      @if (loading()) {
        <span>Envoi en cours...</span>
      } @else {
        <span>Envoyer le code de confirmation</span>
      }
    </button>
  </form>

  @if (message()) {
    <div class="message" [class.error]="isError()">
      {{ message() }}
    </div>
  }

  <p>
    <a (click)="navigateToLogin()">Retour à la connexion</a>
  </p>
</div>
