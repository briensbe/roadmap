@if (visible) {
  <div class="modal-overlay" (click)="onClose()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <div class="header-titles">
          <h3 class="modal-title">Détail de la sélection</h3>
          @if (rowLabel) {
            <span class="modal-subtitle">{{ rowLabel }}</span>
          }
        </div>
        <button class="close-btn" (click)="onClose()" title="Fermer">
          <lucide-icon [img]="X" [size]="18"></lucide-icon>
        </button>
      </div>

      <div class="modal-body">
        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-icon-wrapper units-icon">
              <lucide-icon [img]="Layers" [size]="20"></lucide-icon>
            </div>
            <div class="metric-data">
              <span class="metric-value">{{ units | number: '1.0-2' }}</span>
              <span class="metric-label">Unités positionnées</span>
            </div>
          </div>

          <div class="metric-card">
            <div class="metric-icon-wrapper days-icon">
              <lucide-icon [img]="Clock" [size]="20"></lucide-icon>
            </div>
            <div class="metric-data">
              <span class="metric-value">{{ days | number: '1.0-1' }}</span>
              <span class="metric-label">Jours</span>
            </div>
          </div>

          <div class="metric-card">
            <div class="metric-icon-wrapper weeks-icon">
              <lucide-icon [img]="Calendar" [size]="20"></lucide-icon>
            </div>
            <div class="metric-data">
              <span class="metric-value">{{ weeksCount }}</span>
              <span class="metric-label">Semaine{{ weeksCount > 1 ? 's' : '' }}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-primary" (click)="onClose()">Fermer</button>
      </div>
    </div>
  </div>
}
